<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carina — model proxy</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
      header { padding: 16px 24px; border-bottom: 1px solid #262a33; display: flex; align-items: baseline; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; }
      header span { color: #8a8f98; font-size: 13px; }
      .language-picker { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .language-picker label { margin: 0; white-space: nowrap; }
      .language-picker select { width: auto; min-width: 118px; }
      main { max-width: 920px; margin: 0 auto; padding: 24px; }
      .card { background: #171a21; border: 1px solid #262a33; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
      .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid #394150; }
      .pill.active { background: #1e3a2f; border-color: #2f6b4f; color: #7ee2b0; }
      .pill.closed { color: #7ee2b0; } .pill.open { color: #ff8a8a; } .pill.half_open { color: #ffd479; }
      .muted { color: #8a8f98; font-size: 13px; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
      button.secondary { background: #2b303b; } button.danger { background: #5b2330; }
      button:hover { filter: brightness(1.1); }
      input, select, textarea { background: #0f1115; color: #e6e6e6; border: 1px solid #394150; border-radius: 7px; padding: 7px 9px; font-size: 13px; width: 100%; box-sizing: border-box; }
      textarea { min-height: 120px; font-family: ui-monospace, monospace; resize: vertical; }
      label { display: block; font-size: 12px; color: #8a8f98; margin: 8px 0 3px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
      .actions { display: flex; gap: 8px; }
      h2 { font-size: 15px; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>carina</h1>
      <span data-i18n="header.subtitle">local model-service proxy</span>
      <div class="language-picker">
        <label for="language" data-i18n="language.label">Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
        </select>
      </div>
    </header>
    <main>
      <div class="card">
        <h2 data-i18n="providers.title">Providers</h2>
        <div id="providers" class="muted" data-i18n="common.loading">Loading…</div>
      </div>
      <div class="card">
        <h2 data-i18n="routing.title">Smart routing</h2>
        <div class="grid">
          <div>
            <label data-i18n="routing.mode">Mode</label>
            <select id="r-mode">
              <option value="manual" data-i18n="routing.modeManual">manual — active provider first</option>
              <option value="rule" data-i18n="routing.modeRule">rule — request rules and priority</option>
              <option value="adaptive" data-i18n="routing.modeAdaptive">adaptive — rules and live scoring</option>
            </select>
          </div>
          <div>
            <label data-i18n="routing.latencyTarget">Latency target (ms)</label>
            <input id="r-latency" type="number" min="1" value="2000" />
          </div>
        </div>
        <label data-i18n="routing.rules">Rules (JSON array)</label>
        <textarea id="r-rules" spellcheck="false">[]</textarea>
        <div class="muted" style="margin-top:6px;" data-i18n="routing.rulesHelp">Rules match model_patterns and stream; they can use provider_ids, require_tags, prefer_tags, and strict.</div>
        <div class="actions" style="margin-top: 14px;">
          <button id="routing-save" data-i18n="routing.save">Save routing</button>
        </div>
      </div>
      <div class="card">
        <h2 id="form-title" data-i18n="provider.addTitle">Add provider</h2>
        <input type="hidden" id="f-id" />
        <div class="grid">
          <div><label data-i18n="provider.name">Name</label><input id="f-name" placeholder="My provider" data-i18n-placeholder="provider.namePlaceholder" /></div>
          <div>
            <label data-i18n="provider.protocol">Protocol</label>
            <select id="f-protocol">
              <option value="openai">openai</option>
              <option value="anthropic">anthropic</option>
            </select>
          </div>
          <div><label data-i18n="provider.baseUrl">Base URL</label><input id="f-base_url" placeholder="https://api.openai.com/v1" /></div>
          <div><label data-i18n="provider.defaultModel">Default model</label><input id="f-default_model" placeholder="gpt-4o-mini" /></div>
          <div><label data-i18n="provider.apiKey">API key</label><input id="f-api_key" type="password" placeholder="leave blank to keep existing" data-i18n-placeholder="provider.apiKeyPlaceholder" /></div>
          <div><label data-i18n="provider.priority">Priority (lower = preferred)</label><input id="f-priority" type="number" value="100" /></div>
          <div><label data-i18n="provider.modelPatterns">Model patterns (comma separated)</label><input id="f-model_patterns" placeholder="gpt-*, o3" /></div>
          <div><label data-i18n="provider.tags">Tags (comma separated)</label><input id="f-tags" placeholder="fast, cheap" data-i18n-placeholder="provider.tagsPlaceholder" /></div>
          <div><label data-i18n="provider.capabilities">Capabilities</label><input id="f-capabilities" placeholder="streaming, tools" /></div>
          <div><label data-i18n="provider.contextWindow">Context window</label><input id="f-context_window" type="number" min="1" /></div>
          <div><label data-i18n="provider.maxOutputTokens">Max output tokens</label><input id="f-max_output_tokens" type="number" min="1" /></div>
          <div><label data-i18n="provider.inputCost">Input cost / 1M tokens</label><input id="f-input_cost" type="number" min="0" step="0.01" /></div>
          <div><label data-i18n="provider.outputCost">Output cost / 1M tokens</label><input id="f-output_cost" type="number" min="0" step="0.01" /></div>
        </div>
        <div class="actions" style="margin-top: 14px;">
          <button id="save" data-i18n="common.save">Save</button>
          <button id="reset" class="secondary" data-i18n="common.clear">Clear</button>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
