<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carina — model proxy</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
      header { padding: 16px 24px; border-bottom: 1px solid #262a33; display: flex; align-items: baseline; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; }
      header span { color: #8a8f98; font-size: 13px; }
      main { max-width: 920px; margin: 0 auto; padding: 24px; }
      .card { background: #171a21; border: 1px solid #262a33; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
      .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid #394150; }
      .pill.active { background: #1e3a2f; border-color: #2f6b4f; color: #7ee2b0; }
      .pill.closed { color: #7ee2b0; } .pill.open { color: #ff8a8a; } .pill.half_open { color: #ffd479; }
      .muted { color: #8a8f98; font-size: 13px; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
      button.secondary { background: #2b303b; } button.danger { background: #5b2330; }
      button:hover { filter: brightness(1.1); }
      input, select { background: #0f1115; color: #e6e6e6; border: 1px solid #394150; border-radius: 7px; padding: 7px 9px; font-size: 13px; width: 100%; box-sizing: border-box; }
      label { display: block; font-size: 12px; color: #8a8f98; margin: 8px 0 3px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
      .actions { display: flex; gap: 8px; }
      h2 { font-size: 15px; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>carina</h1>
      <span>local model-service proxy</span>
    </header>
    <main>
      <div class="card">
        <h2>Providers</h2>
        <div id="providers" class="muted">Loading…</div>
      </div>
      <div class="card">
        <h2 id="form-title">Add provider</h2>
        <input type="hidden" id="f-id" />
        <div class="grid">
          <div><label>Name</label><input id="f-name" placeholder="My provider" /></div>
          <div>
            <label>Protocol</label>
            <select id="f-protocol">
              <option value="openai">openai</option>
              <option value="anthropic">anthropic</option>
            </select>
          </div>
          <div><label>Base URL</label><input id="f-base_url" placeholder="https://api.openai.com/v1" /></div>
          <div><label>Default model</label><input id="f-default_model" placeholder="gpt-4o-mini" /></div>
          <div><label>API key</label><input id="f-api_key" type="password" placeholder="leave blank to keep existing" /></div>
          <div><label>Priority (lower = preferred)</label><input id="f-priority" type="number" value="100" /></div>
          <div style="grid-column: 1 / -1;"><label>Model map (client model → provider model, one per line: gpt-4o=claude-sonnet-4-20250514)</label><textarea id="f-model_map" rows="3" style="background:#0f1115;color:#e6e6e6;border:1px solid #394150;border-radius:7px;padding:7px 9px;font-size:13px;width:100%;box-sizing:border-box;font-family:monospace;resize:vertical;"></textarea></div>
          <div style="grid-column: 1 / -1;"><label>Fallback models (comma-separated, tried in order when primary fails)</label><input id="f-fallback_models" placeholder="claude-3-haiku-20240307, gpt-4o-mini" /></div>
        </div>
        <div class="actions" style="margin-top: 14px;">
          <button id="save">Save</button>
          <button id="reset" class="secondary">Clear</button>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
